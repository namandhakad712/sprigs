<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Play — Sprig Games</title>
<style>
  :root {
    --paper: #FAFED7;
    --ink: #14201C;
    --green: #078969;
    --green-dark: #0B3D2E;
    --red: #E03131;
    --card: #FFFDF0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    background-image: radial-gradient(#14201c22 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: ui-monospace, "Cascadia Mono", "Fira Mono", Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 2px solid var(--ink);
    background: var(--card);
    flex-wrap: wrap;
  }
  header a {
    color: var(--ink);
    text-decoration: none;
    border: 2px solid var(--ink);
    padding: 6px 12px;
    background: #fff;
    box-shadow: 3px 3px 0 var(--ink);
    font-size: 13px;
    font-weight: 700;
  }
  header a:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  header a.play-here { background: var(--green); color: #fff; }
  #title { font-size: 20px; font-weight: 800; letter-spacing: 1px; }
  #genre {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    background: var(--ink);
    color: var(--paper);
    padding: 4px 10px;
  }
  main {
    flex: 1;
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 20px 40px;
    flex-wrap: wrap;
  }
  .cabinet {
    background: var(--ink);
    padding: 18px;
    border: 2px solid var(--ink);
    box-shadow: 6px 6px 0 #14201c44;
  }
  canvas {
    display: block;
    width: min(640px, 86vw);
    height: auto;
    aspect-ratio: 5 / 4;
    image-rendering: pixelated;
    background: #000;
    cursor: pointer;
  }
  .side { width: min(340px, 92vw); display: flex; flex-direction: column; gap: 14px; }
  .panel {
    background: var(--card);
    border: 2px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    padding: 14px;
  }
  .panel h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 6px;
  }
  .controls-list { font-size: 13px; line-height: 2; }
  kbd {
    display: inline-block;
    min-width: 26px;
    text-align: center;
    background: var(--ink);
    color: var(--paper);
    padding: 2px 7px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    margin-right: 2px;
  }
  .pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pad button {
    font-family: inherit;
    font-weight: 800;
    font-size: 16px;
    padding: 12px 0;
    background: #fff;
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    cursor: pointer;
    touch-action: manipulation;
  }
  .pad button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .pad button.action { background: var(--green); color: #fff; }
  #status {
    font-size: 12px;
    line-height: 1.7;
    max-height: 120px;
    overflow: auto;
    white-space: pre-wrap;
  }
  #status .err { color: var(--red); font-weight: 700; }
  #status .ok { color: var(--green); font-weight: 700; }
  .hint { font-size: 12px; line-height: 1.7; }
  footer {
    border-top: 2px solid var(--ink);
    padding: 12px 20px;
    font-size: 12px;
    background: var(--card);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  footer a { color: var(--green-dark); font-weight: 700; }
</style>
</head>
<body>
<header>
  <a href="./">&#8592; ALL GAMES</a>
  <span id="title">LOADING&hellip;</span>
  <span id="genre"></span>
  <span style="flex:1"></span>
  <a id="share" class="play-here" href="#" target="_blank" rel="noopener">OPEN IN SPRIG &#8599;</a>
</header>
<main>
  <div class="cabinet">
    <canvas id="game" width="640" height="512" tabindex="0"></canvas>
  </div>
  <div class="side">
    <div class="panel">
      <h3>How to play</h3>
      <p class="hint" id="about" style="margin-bottom:8px"></p>
      <div class="controls-list" id="howto" style="line-height:1.8"></div>
    </div>
    <div class="panel">
      <h3>Controls</h3>
      <div class="controls-list" id="controls"></div>
    </div>
    <div class="panel">
      <h3>Touch / Mouse Pad</h3>
      <div class="pad" id="pad"></div>
      <p class="hint" style="margin-top:10px">Tip: click the screen once so it holds keyboard focus, then use WASD + I/J/K/L.</p>
    </div>
    <div class="panel">
      <h3>Status</h3>
      <div id="status">boot&hellip;</div>
    </div>
  </div>
</main>
<footer>
  <span>SPRIG GAMES COLLECTION</span>
  <span>Paste any <b>.js</b> into the <a href="https://sprig.hackclub.com/editor" target="_blank" rel="noopener">Sprig editor</a> to play on hardware.</span>
</footer>

<script type="module">
  const GAMES = {
    "sprigos":  { title: "SprigOS", genre: "OS Sim / Puzzle",
                  file: "sprigos/game.js",
                  share: "https://sprig.hackclub.com/share/ANNlTxgIrId3kEl6fydN",
                  about: "A tiny operating system on a 160x128 screen.",
                  howto: ["W/S moves the desktop cursor, I opens the selected app, K goes back, L restarts.",
                          "Apps: Terminal (try: help, ls, hack), Files, Calculator, and Hack — a 5-puzzle mini-game.",
                          "Goal: explore every app and breach the mainframe in Hack."],
                  controls: [["W S A D", "Navigate"], ["I", "Select"], ["K", "Back"], ["L", "Restart"]] },
    "arcana":   { title: "Arcana Ascent", genre: "Deckbuilding Roguelite",
                  file: "arcana_ascent/arcana_ascent.js",
                  share: "https://sprig.hackclub.com/share/2nz3NPD0nm5VvfpySjln",
                  about: "Slay-the-Spire-style deckbuilder: climb 5 floors, draft a card after each guardian.",
                  howto: ["W/S picks a card in hand (A/D flips Deck/Draw/Discard tabs), I plays it, J ends your turn.",
                          "Block soaks hits, poison ticks down, energy refills to 3 each turn.",
                          "After each win: I takes the highlighted card, K skips it for +6 HP."],
                  controls: [["W S", "Cursor"], ["A D", "Deck tabs"], ["I", "Play / Confirm"], ["J", "End turn"], ["K", "Deck / Skip"], ["L", "Title"]] },
    "rail":     { title: "Rail Yard Dispatcher", genre: "Real-Time Puzzle",
                  file: "rail-yard-dispatcher/rail_dispatcher.js",
                  share: "https://sprig.hackclub.com/share/0P2SdWjEwyQ1y0DJ7VnR",
                  about: "Trains roll in from the top — steer each one to the depot of its own color.",
                  howto: ["WASD hops the cursor between yellow junction arrows, I/J rotates the arrow under it.",
                          "Red train goes to red depot, blue to blue, yellow to yellow. Wrong depot costs 1 HP (3 total).",
                          "K pauses, L restarts. Clear all 3 levels as speed ramps up."],
                  controls: [["W A S D", "Hop cursor"], ["I / J", "Rotate arrow"], ["K", "Pause"], ["L", "Restart"]] },
    "mirror":   { title: "MirrorSelf", genre: "Mirror Puzzle",
                  file: "mirrorself/mirrorself.js",
                  share: "https://sprig.hackclub.com/share/UTktIABTRpOXN3uuxV6V",
                  about: "One brain, two bodies: your pink twin mirrors every step 180 degrees around the center.",
                  howto: ["WASD steps both bodies at once. Park yourself on YOUR door (D) and your twin on ITS door (M).",
                          "The floor remembers your trail — stepping on your own past kills you. Spikes kill both.",
                          "L undoes one step per level, I retries, K opens level select. 5 levels, 3 lives."],
                  controls: [["W A S D", "Step both"], ["L", "Undo (1x)"], ["I", "Retry / Next"], ["K", "Level select"]] },
    "shadow":   { title: "Shadow Harvest", genre: "Light/Shadow Strategy",
                  file: "shadow-harvest/shadow_harvest.js",
                  share: "https://sprig.hackclub.com/share/4dvtOmgFRtMj7giObQSe",
                  about: "Farm light-crystals while beasts hunt them down across 3 phases.",
                  howto: ["Any key dismisses the help screen. WASD moves the farmer.",
                          "Stand on a mature crop and press I to harvest. J drops a mirror that blocks beasts. K flashes (stuns all beasts, limited uses).",
                          "Crops only mature in their matching light phase while its crystal is lit — harvest 3 of each kind to advance."],
                  controls: [["W A S D", "Move"], ["I", "Harvest"], ["J", "Place mirror"], ["K", "Flash (stun)"]] },
    "pixel":    { title: "Pixel Painter", genre: "Generative Art Sandbox",
                  file: "pixel-painter/pixel-painter.js",
                  share: "https://sprig.hackclub.com/share/XH9wwilFpX9G1ofmORpU",
                  about: "Paint tiles and watch them come alive under cellular-automata rules.",
                  howto: ["Any key starts. WASD moves the cursor, I/J/K/L stamps red, blue, green, yellow.",
                          "Tiles spread to empty neighbors and lonely tiles fade — the art evolves on its own.",
                          "You get 120 seconds. Score = painted tiles x colors used."],
                  controls: [["W A S D", "Cursor"], ["I", "Red"], ["J", "Blue"], ["K", "Green"], ["L", "Yellow"]] },
    "laser":    { title: "The Great Laser Pointer Heist", genre: "Stealth Puzzle",
                  file: "laser-pointer-heist/game.js",
                  share: "https://sprig.hackclub.com/share/dCbT6z5p0pomstLxg2Ft",
                  about: "You are Garfield-X the meme cat, robbing 7 security zones for the red dot.",
                  howto: ["J or W starts. WASD moves, J flips gravity (walk on ceilings!), K resets the zone.",
                          "Grab every fish energy drive, dodge Dr. Stick's flashlight patrols, then steal the laser pointer.",
                          "Getting spotted busts you back — plan routes around the patrols."],
                  controls: [["W A S D", "Move"], ["J", "Flip gravity"], ["K", "Reset level"]] },
  };

  const canvas = document.getElementById("game");
  const statusEl = document.getElementById("status");
  const log = (m, cls) => {
    const d = document.createElement("div");
    if (cls) d.className = cls;
    d.textContent = m;
    statusEl.appendChild(d);
    statusEl.scrollTop = statusEl.scrollHeight;
  };
  window.addEventListener("error", (e) => log("PAGEERROR: " + e.message, "err"));
  window.addEventListener("unhandledrejection", (e) => log("REJECT: " + (e.reason && e.reason.message || e.reason), "err"));

  const id = new URLSearchParams(location.search).get("game");
  const meta = GAMES[id];
  if (!meta) {
    document.getElementById("title").textContent = "UNKNOWN GAME";
    log('Unknown ?game=. Pick one: ' + Object.keys(GAMES).join(", "), "err");
    throw new Error("unknown game");
  }
  document.title = meta.title + " — Sprig Games";
  document.getElementById("title").textContent = meta.title.toUpperCase();
  document.getElementById("genre").textContent = meta.genre;
  document.getElementById("share").href = meta.share;
  document.getElementById("controls").innerHTML =
    meta.controls.map(([k, a]) => `<div><kbd>${k}</kbd> ${a}</div>`).join("");
  document.getElementById("about").textContent = meta.about;
  document.getElementById("howto").innerHTML =
    meta.howto.map((line) => `<div style="margin-bottom:6px">${line}</div>`).join("");

  // On-screen pad: same 8 Sprig keys, dispatches to the canvas.
  window.__press = (key) => canvas.dispatchEvent(new KeyboardEvent("keydown", { key }));
  const pad = document.getElementById("pad");
  for (const key of ["w", "a", "s", "d", "i", "j", "k", "l"]) {
    const b = document.createElement("button");
    b.textContent = key.toUpperCase();
    if ("ijkl".includes(key)) b.className = "action";
    b.onclick = () => { window.__press(key); canvas.focus(); };
    pad.appendChild(b);
  }

  // Keyboard focus: the engine listens on the canvas.
  const refocus = () => canvas.focus();
  document.addEventListener("click", refocus);
  canvas.addEventListener("blur", () => setTimeout(() => { if (document.hasFocus()) refocus(); }, 50));

  try {
    // Local vendored engine first (works offline / on Pages), CDN fallback.
    let webEngine;
    try {
      ({ webEngine } = await import("./vendor/sprig/dist/web/index.js"));
      log("engine: local vendor");
    } catch (e) {
      ({ webEngine } = await import("https://esm.sh/sprig@1.1.3/web"));
      log("engine: esm.sh CDN");
    }
    // Fetch source BEFORE constructing the engine: its rAF loop exits if
    // the first frame runs before the game calls setMap.
    const src = await (await fetch(meta.file)).text();
    log("source: " + meta.file + " (" + src.length + " bytes)");
    const game = webEngine(canvas);
    window.__game = game;
    const api = game.api;
    const params = ["setLegend", "setBackground", "setMap", "setSolids", "setPushables",
      "onInput", "afterInput", "getFirst", "getAll", "getTile", "getGrid", "addSprite",
      "clearTile", "clearText", "addText", "width", "height", "tilesWith", "playTune",
      "bitmap", "map", "color", "tune", "setTimeout", "setInterval", "clearTimeout", "clearInterval"];
    new Function(...params, src)(...params.map((k) => api[k] ?? window[k]));
    log("GAME LOADED OK", "ok");
    window.__loaded = true;
    refocus();
  } catch (e) {
    log("LOAD ERROR: " + e.message, "err");
  }
</script>
</body>
</html>
